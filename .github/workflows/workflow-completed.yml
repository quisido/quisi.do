# yaml-language-server: $schema=../../schemas/github-workflow.jsonc
name: Workflow completed

concurrency:
  cancel-in-progress: true
  group: >-
    workflow-completed__${{
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}

on:
  workflow_run:
    types:
      - completed
    workflows:
      - Pull request

permissions: {}

jobs:
  dependabot-pull-request-failure:
    name: Dependabot pull request failure
    environment: codex
    runs-on: ubuntu-26.04
    if: >-
      (
        github.actor == 'Copilot' ||
        github.actor == 'copilot-swe-agent[bot]' ||
        github.actor == 'dependabot[bot]' ||
        github.actor == 'quisido-codex[bot]'
      ) &&
      github.event.workflow_run.name == 'Pull request' &&
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read
      contents: write      # Codex
      issues: write        # Codex
      pull-requests: write # Codex
    steps:
      - name: Get head ref
        id: ref
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |-
            const [pullRequest] =
              context.payload.workflow_run.pull_requests ?? [];
            if (pullRequest === undefined) {
              throw new Error('No pull request found for this workflow run.');
            }

            const {
              data: {
                head: {
                  ref: headRef,
                  repo: { full_name: fullName },
                },
                merged,
                title,
                user: { login: userLogin },
              },
            } = await github.rest.pulls.get({
              owner: context.repo.owner,
              pull_number: pullRequest.number,
              repo: context.repo.repo,
            });

            if (fullName !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The Codex action does not support forks.', {
                cause: fullName,
              });
            }

            if (merged) {
              throw new Error('The pull request was already merged.');
            }

            if (userLogin !== 'dependabot[bot]') {
              throw new Error(
                'The pull request was not opened by dependabot.',
                { cause: userLogin }
              );
            }

            return headRef;

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.CODEX_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_PRIVATE_KEY }}

      - name: Configure git
        env:
          CODEX_EMAIL: quisido-codex[bot]@users.noreply.github.com
        run: >-
          git config --global user.email "$CODEX_EMAIL";
          git config --global user.name "quisido-codex[bot]";

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 9
          persist-credentials: true
          ref: ${{ steps.ref.outputs.result }}
          show-progress: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Limit retries
        env:
          CODEX_EMAIL: quisido-codex[bot]@users.noreply.github.com
          MAX_CODEX_ATTEMPTS: 3
        run: |-
          set -euo pipefail
          attempts=0
          while IFS='|' read -r author committer; do
            if [[
              "$author" == "$CODEX_EMAIL" ||
              "$committer" == "$CODEX_EMAIL"
            ]]; then
              attempts=$((attempts + 1))
              continue
            fi
            break
          done < <(
            git log --format='%ae|%ce' --max-count="$MAX_CODEX_ATTEMPTS"
          )
          if (( attempts == 0 )); then
            echo "Codex will attempt to resolve this. (1/$MAX_CODEX_ATTEMPTS)";
            exit 0;
          fi
          if (( attempts < MAX_CODEX_ATTEMPTS )); then
            attempt=$((attempts + 1))
            echo "::warning title=Codex is retrying::Codex will attempt to resolve this. ($attempt/$MAX_CODEX_ATTEMPTS)"
            exit 0;
          fi
          echo "::error title=Codex quits::Codex was unable to resolve this failure after $attempts attempts."
          exit 1

      - name: Build
        uses: ./.github/actions/build
        with:
          continue-on-error: true
          environment: development
          upload: false

      - name: Get error logs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh run view ${{ github.event.workflow_run.id }} --log-failed >
          failed-steps.txt;

      - name: Execute
        uses: ./.github/actions/codex
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          codex-token: ${{ steps.app-token.outputs.token }}
          secrets-client-id: ${{ vars.WRITE_SECRETS_CLIENT_ID }}
          secrets-private-key: ${{ secrets.WRITE_SECRETS_PRIVATE_KEY }}
          prompt: |-
            Dependabot opened pull request
            #${{ github.event.workflow_run.pull_requests[0].number }}, and it
            failed this repository's continuous integration workflow (run
            #${{ github.event.workflow_run.id }}).

            The pull request branch is checked out locally. Failed steps
            (`gh run view ${{ github.event.workflow_run.id }} --log-failed`)
            have been saved to the @failed-steps.txt file. You may search these
            logs with `rg --context=# --max-count=# "PATTERN" failed-steps.txt`.

            ### Tasks

            1. Resolve the workflow's errors _without_ downgrading dependencies.
            2. Verify that `npm run build` and `npm test` both pass. If not,
               resolve any errors.
            3. Commit and push your changes to the pull request branch.
            4. Post a comment on the pull request stating what permissions,
               tools, or changes to `AGENTS.md` will make future executions more
               token efficient.
