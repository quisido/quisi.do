# yaml-language-server: $schema=../../../schemas/github-action.jsonc
name: Lighthouse
description: Runs Lighthouse audits

runs:
  using: composite
  steps:
    - name: Setup
      uses: ./.github/actions/setup
    - name: Install Lighthouse browser
      shell: bash
      working-directory: packages/saas
      run: npx playwright install chromium
    - name: Audit
      shell: bash
      working-directory: packages/saas
      run: >-
        node ./scripts/lighthouse-ci.ts;
        chmod +x ./scripts/postlighthouse.sh;
        ./scripts/postlighthouse.sh;
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lighthouse-ci
        if-no-files-found: error
        path: |
          packages/saas/lighthouse.report.*
          packages/saas/lighthouse-*.devtoolslog.json
          packages/saas/lighthouse-*.trace.json
