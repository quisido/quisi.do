# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json

updates:
- package-ecosystem: github-actions
  assignees:
  - quisido
  directory: /
  groups:
    github-actions:
      patterns:
      - "*"
  schedule:
    interval: daily
- package-ecosystem: npm
  assignees:
  - quisido
  # Dependabot should automatically discover workspaces in `packages/`.
  directory: /
  groups:
    dependencies:
      dependency-type: production
      patterns:
      - "*"
    dev-dependencies:
      dependency-type: development
      patterns:
      - "*"
  schedule:
    interval: daily
  versioning-strategy: increase

version: 2
